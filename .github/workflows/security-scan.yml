name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Audit dependencies
        # Known baseline vulnerabilities are ignored below; new ones will fail this check.
        # The mitmproxy 10.x advisories (GHSA-527g-3w9m-29hv, GHSA-63cx-g855-hvv4,
        # GHSA-wg33-5h85-7q5p, PYSEC-2026-92) cannot be resolved without dropping
        # Python < 3.12 support, as mitmproxy 12+ requires Python 3.12+.
        # The tornado advisories (GHSA-cx3h-4qpv-8hc9, GHSA-mgf9-4vpg-hj56,
        # GHSA-3x9g-8vmp-wqvf, GHSA-pw6j-qg29-8w7f) cannot be resolved because
        # mitmproxy 12.2.3 pins tornado<=6.5.5; fixed versions require tornado>=6.5.6.
        # The newer advisories below are likewise blocked by mitmproxy's
        # dependency pins and are retained as known baseline vulnerabilities.
        run: |
          uv --preview audit --frozen \
            --ignore GHSA-2qfp-q593-8484 \
            --ignore GHSA-79v4-65xg-pq4g \
            --ignore GHSA-h4gh-qq45-vh27 \
            --ignore GHSA-m959-cc7f-wv43 \
            --ignore GHSA-r6ph-v2qm-q3c2 \
            --ignore PYSEC-2026-35 \
            --ignore GHSA-68rp-wp8r-4726 \
            --ignore GHSA-vqfr-h8mv-ghfj \
            --ignore GHSA-527g-3w9m-29hv \
            --ignore GHSA-63cx-g855-hvv4 \
            --ignore GHSA-wg33-5h85-7q5p \
            --ignore PYSEC-2026-92 \
            --ignore GHSA-5pwr-322w-8jr4 \
            --ignore GHSA-vp96-hxj8-p424 \
            --ignore GHSA-537c-gmf6-5ccf \
            --ignore GHSA-6v7p-g79w-8964 \
            --ignore GHSA-cx3h-4qpv-8hc9 \
            --ignore GHSA-mgf9-4vpg-hj56 \
            --ignore GHSA-3x9g-8vmp-wqvf \
            --ignore GHSA-pw6j-qg29-8w7f \
            --ignore PYSEC-2026-4322 \
            --ignore GHSA-6hr6-w5qg-qmwg \
            --ignore PYSEC-2026-3628 \
            --ignore PYSEC-2026-4053 \
            --ignore GHSA-xmj3-9gf7-h52w \
            --ignore GHSA-chx6-46f5-w4vp \
            --ignore GHSA-wwv5-g3v4-889x \
            --ignore GHSA-8423-8fgw-73vq \
            --ignore GHSA-3hv7-mjh2-fv65 \
            --ignore GHSA-c2m8-h5v5-343r \
            --ignore PYSEC-2026-3928 \
            --ignore PYSEC-2026-4312 \
            --ignore GHSA-9m75-vc3g-4x39 \
            --ignore GHSA-mm57-4v3p-rchx \
            --ignore GHSA-fm9c-5rcf-2q5p \
            --ignore GHSA-2qm8-x737-gmw5 \
            --ignore GHSA-pcg2-g6cj-q92c \
            --ignore GHSA-5cjw-f85j-cv6r \
            --ignore GHSA-r4j5-9xpp-3985 \
            --ignore GHSA-pw9p-v7r6-gx4p \
            --ignore GHSA-cp25-j9x5-p5xm
